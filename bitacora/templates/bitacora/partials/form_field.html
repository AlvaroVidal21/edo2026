<div class="field-wrap {% if field.field.widget.input_type == 'checkbox' %}field-checkbox{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}<label class="form-check">{{ field }}<span class="form-check-label">{{ field.label }}</span></label>{% else %}<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark">*</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
